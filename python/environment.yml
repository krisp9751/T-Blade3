# Conda environment "tblade" for T-Blade3: Fortran compiler, the tblade3 Python package and GUI.
# Normally made by ./install.sh in the repository root, which also builds T-Blade3 and
# installs the `tblade` command. By hand:
#   conda env create -f python/environment.yml
#   conda activate tblade
#   make code library
#   pip install --no-deps -e python
name: tblade
channels:
  - conda-forge
dependencies:
  - python=3.14
  - numpy
  - scipy
  - pyyaml
  - pytest
  - pytest-qt
  - pyside6
  - pyvista
  - pyvistaqt
  - pyqtgraph
  # OpenCASCADE (B-Rep geometry, STEP and .brep export: tblade3.brep)
  - ocp
  - gfortran
  # Link against glibc 2.28 so the binaries run on any Linux from RHEL 8 / glibc 2.28 on
  # (the default sysroot is newer than AlmaLinux 9's glibc 2.34)
  - sysroot_linux-64=2.28
  - make
  - pip
  - setuptools
